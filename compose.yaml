# Reference deployment of the web client's image; docs/web-client.md
# describes it. The server is a separate process the browser connects to.
name: ashe-agent-web

services:
  web:
    image: localhost/ashe-agent-web
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs:
      - /data
      - /config
    ports:
      - "127.0.0.1:8080:8080"
